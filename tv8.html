<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — TV8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Marck+Script&family=Oswald:wght@500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="bat-fly-up.png" />
  <link rel="preload" as="image" href="bat-fly-down.png" />
  <link rel="preload" as="image" href="bat-shock.png" />
  <link rel="preload" as="image" href="bat-wince.png" />
  <link rel="preload" as="image" href="bat-dizzy.png" />
  <link rel="preload" as="image" href="bat-wake.png" />
  <style>
    :root { --hot: #ff2a18; --price: #ff2a18; --ink: #090807; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #050403; color: #fff; font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .stage {
      width: 1280px; height: 720px; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--sx, 1), var(--sy, 1));
      background:
        radial-gradient(320px 520px at -20px 46%, rgba(255, 78, 16, .34), transparent 68%),
        radial-gradient(300px 480px at 1300px 50%, rgba(255, 64, 10, .32), transparent 70%),
        radial-gradient(640px 140px at 50% 100%, rgba(90, 28, 8, .55), transparent 72%),
        var(--ink);
      display: grid; grid-template-rows: 112px minmax(0, 1fr) 72px;
      padding: 14px 26px 8px;
      user-select: none;
    }
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    .badge { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .badge.right { justify-content: flex-end; }
    .mark { width: 78px; height: 78px; flex: none; }
    .words { margin: 0; color: var(--price); font-family: "Marck Script", cursive; font-size: 26px; line-height: .92; position: relative; }
    .words::after { content: ""; position: absolute; left: 0; right: 8%; bottom: -3px; height: 3px; background: var(--hot); border-radius: 2px; transform: rotate(-7deg); }
    .brand { text-align: center; }
    .word { border: 0; background: transparent; padding: 0; font-family: "Rubik Wet Paint", system-ui, sans-serif; font-size: 60px; line-height: .8; color: var(--hot); text-shadow: 0 2px 0 #7a0c08; }
    .navline { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; color: #f4f4f4; font-family: Oswald, sans-serif; font-weight: 500; font-size: 16px; letter-spacing: .22em; }
    .navline i { display: block; height: 2px; width: 54px; background: var(--hot); font-style: normal; }
    .cols { min-height: 0; display: grid; grid-template-columns: .96fr 1.18fr .96fr; }
    .col { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0 18px 0; border-right: 2px solid rgba(255,255,255,.32); }
    .col:last-child { border-right: 0; }
    h2 { margin: 0; display: inline-block; color: #fff; font-family: Oswald, sans-serif; font-weight: 700; font-size: 40px; line-height: .9; letter-spacing: .02em; text-transform: uppercase; }
    h2::after { content: ""; display: block; width: 78%; height: 5px; margin-top: 6px; background: var(--hot); border-radius: 4px; transform: rotate(-1.4deg); transform-origin: left center; }
    h2.extra { margin-top: 8px; color: var(--price); font-size: 28px; }
    h2.extra::after { width: 92%; height: 4px; }
    .title-row { display: flex; align-items: center; gap: 12px; }
    .title-row h2::after { width: 100%; }
    h2.subhead { margin-top: 10px; }
    .kg { flex: none; border: 2px solid var(--price); border-radius: 14px; padding: 1px 12px 3px; color: #fff; font-family: Oswald, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: .03em; line-height: 1.15; }
    .kg:empty { display: none; }
    .stack { margin-top: 8px; }
    .col.left h3 { font-size: 24px; line-height: 1.05; }
    .line { margin-top: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .line h3 { white-space: nowrap; font-size: 29px; }
    .line .price { font-size: 40px; }
    h3 { margin: 0; color: #fff; font-family: Oswald, sans-serif; font-weight: 600; font-size: 32px; line-height: 1; }
    .meta { margin: 2px 0 0; color: #dedede; font-weight: 700; font-size: 16px; line-height: 1.1; }
    .ings { margin: 3px 0 0; color: #fff; font-weight: 700; font-size: 14px; line-height: 1.12; }
    .ings[hidden] { display: none; }
    .price { margin: 0; color: var(--price); font-family: Oswald, sans-serif; font-weight: 700; font-size: 44px; line-height: .95; white-space: nowrap; }
    .flavors { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 6px; }
    .flavor { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding-bottom: 7px; border-bottom: 1px solid rgba(255,255,255,.34); }
    .flavor:last-child { border-bottom: 0; }
    .flavor h3 { font-size: 30px; font-weight: 500; white-space: nowrap; }
    .flavor .price { font-size: 38px; }
    .dish {
      width: calc(100% + 36px); margin: auto -18px 0; min-height: 0; flex: 1 1 auto;
      display: block; object-fit: cover; object-position: center 48%;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 100%);
    }
    .col.left .dish { max-height: 210px; }
    .col.right .dish { max-height: 188px; object-position: center 30%; }
    .foot { position: relative; display: flex; align-items: center; justify-content: center; }
    .qrbox { position: absolute; left: -26px; bottom: -8px; z-index: 4; background: #fff; padding: 6px; line-height: 0; border-radius: 0 8px 0 0; }
    .qrbox svg { width: 176px; height: 176px; display: block; }
    .phone { color: #fff; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: .04em; }
    .stage.smack { animation: tv-shake .55s linear; }
    @keyframes tv-shake {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--sx, 1), var(--sy, 1)); }
      18% { transform: translate(calc(-50% - 16px), calc(-50% + 8px)) scale(var(--sx, 1), var(--sy, 1)) rotate(-.7deg); }
      36% { transform: translate(calc(-50% + 14px), calc(-50% - 7px)) scale(var(--sx, 1), var(--sy, 1)) rotate(.55deg); }
      54% { transform: translate(calc(-50% - 8px), calc(-50% + 4px)) scale(var(--sx, 1), var(--sy, 1)) rotate(-.3deg); }
      72% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)) scale(var(--sx, 1), var(--sy, 1)); }
    }
    .bats { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; contain: layout paint; }
    .bat { position: absolute; left: 0; top: 0; width: 240px; height: 283px; transform-origin: center; filter: drop-shadow(0 12px 8px rgba(0,0,0,.55)); will-change: transform; }
    .bat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .bat.face-fly .up { display: block; }
    .bat.face-fly.flap .up { display: none; }
    .bat.face-fly.flap .down { display: block; }
    .bat.face-shock .shock, .bat.face-wince .wince, .bat.face-dizzy .daze, .bat.face-wake .wake { display: block; }
    .bat.sil .down { display: none; }
    .bat.sil.flap .up { display: none; }
    .bat.sil.flap .down { display: block; }
    .bat.sil { width: 230px; height: 126px; filter: none; }
    .bat.sil svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .star { position: absolute; color: #ffe14a; font-style: normal; font-size: 28px; line-height: 1; text-shadow: 0 0 8px #ff8800; opacity: 0; }
    .hit { position: absolute; width: 0; height: 0; z-index: 7; }
    .hit .flash {
      position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,42,24,.45) 42%, transparent 72%);
      animation: bat-flash .4s ease-out forwards;
    }
    .hit .ring {
      position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.85); animation: bat-ring .5s ease-out forwards;
    }
    .hit .cracks { position: absolute; left: -230px; top: -230px; width: 460px; height: 460px; animation: bat-crack 1.7s ease-out forwards; }
    .hit .burst { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; animation: bat-flash .32s ease-out forwards; }
    .wash { position: absolute; inset: 0; background: rgba(255,255,255,.28); animation: bat-flash .28s ease-out forwards; }
    @keyframes bat-flash { to { opacity: 0; } }
    @keyframes bat-ring { to { transform: scale(9); opacity: 0; } }
    @keyframes bat-crack { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="stage">
    <header class="head">
      <div class="badge">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ff2a18" stroke-width="3.5"/>
          <path d="M34 34c-10-8-18-1-14 8 3 6 10 6 13 1M36 30c2-8 12-8 12 0M66 34c10-8 18-1 14 8-3 6-10 6-13 1M64 30c-2-8-12-8-12 0" fill="none" stroke="#ff2a18" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="46" rx="9" ry="13" fill="#ff2a18"/>
          <path d="M41 58h18l-3 7H44zM43 65h14l-3 6h-8zM46 71h8l-4 9-4-9z" fill="#ff2a18"/>
        </svg>
        <p class="words">смак<br>якість<br>задоволення</p>
      </div>
      <div class="brand">
        <button type="button" class="word" id="logoBtn">KLESHNEVAR</button>
        <div class="navline"><i></i>РАКИ · КРЕВЕТКИ · ПИВО<i></i></div>
      </div>
      <div class="badge right">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ff2a18" stroke-width="3.5"/>
          <path d="M34 34c-10-8-18-1-14 8 3 6 10 6 13 1M36 30c2-8 12-8 12 0M66 34c10-8 18-1 14 8-3 6-10 6-13 1M64 30c-2-8-12-8-12 0" fill="none" stroke="#ff2a18" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="46" rx="9" ry="13" fill="#ff2a18"/>
          <path d="M41 58h18l-3 7H44zM43 65h14l-3 6h-8zM46 71h8l-4 9-4-9z" fill="#ff2a18"/>
        </svg>
        <p class="words">смак<br>якість<br>задоволення</p>
      </div>
    </header>
    <main class="cols">
      <section class="col left">
        <h2>Морські мікси</h2>
        <article class="stack">
          <h3 data-name="mix"></h3>
          <p class="ings" data-ings="mix" hidden></p>
          <p class="meta" data-weight="mix"></p>
          <p class="price" data-key="mix"></p>
        </article>
        <article class="stack">
          <h3 data-name="vip"></h3>
          <p class="ings" data-ings="vip" hidden></p>
          <p class="meta" data-weight="vip"></p>
          <p class="price" data-key="vip"></p>
        </article>
        <img class="dish" src="board-mix.jpg" alt="" />
      </section>
      <section class="col">
        <div class="title-row">
          <h2>Смаки на вибір</h2>
          <span class="kg" id="kgBadge"></span>
        </div>
        <h2 class="subhead">Креветки</h2>
        <div class="flavors">
          <div class="flavor"><h3 data-name="cream"></h3><p class="price" data-key="cream"></p></div>
          <div class="flavor"><h3 data-name="classic"></h3><p class="price" data-key="classic"></p></div>
          <div class="flavor"><h3 data-name="tomato"></h3><p class="price" data-key="tomato"></p></div>
          <div class="flavor"><h3 data-name="tomkha"></h3><p class="price" data-key="tomkha"></p></div>
          <div class="flavor"><h3 data-name="tomyum"></h3><p class="price" data-key="tomyum"></p></div>
          <div class="flavor"><h3 data-name="garlic"></h3><p class="price" data-key="garlic"></p></div>
        </div>
      </section>
      <section class="col right">
        <h2>Хрумке панко</h2>
        <article class="line">
          <div>
            <h3 data-name="mussels"></h3>
            <p class="meta" data-portion="mussels"></p>
          </div>
          <p class="price" data-key="mussels"></p>
        </article>
        <article class="line">
          <div>
            <h3 data-name="shrimp"></h3>
            <p class="meta" data-portion="shrimp"></p>
          </div>
          <p class="price" data-key="shrimp"></p>
        </article>
        <h2 class="extra">Додатково</h2>
        <article class="stack">
          <p class="meta" data-weight="sauce"></p>
          <h3 data-name="sauce"></h3>
          <p class="price" data-key="sauce"></p>
        </article>
        <img class="dish" src="board-panko.jpg" alt="" />
      </section>
    </main>
    <footer class="foot">
      <div class="qrbox" id="qr"></div>
      <a class="phone" href="tel:+380636503959">+380 63 650 39 59</a>
    </footer>
  </div>
  <div class="bats" id="bats"></div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=1124262152&single=true&output=csv";
    function kind(name) {
      const n = name.toLowerCase();
      if (n.includes("мікс") || n.includes("микс")) return n.includes("vip") ? "vip" : "mix";
      if (n.includes("соус")) return "sauce";
      if (n.includes("міді") || n.includes("миди")) return "mussels";
      if (n.includes("панко")) return "shrimp";
      if (n.includes("кха")) return "tomkha";
      if (n.includes("ям")) return "tomyum";
      if (n.includes("часник")) return "garlic";
      if (n.includes("томат")) return "tomato";
      if (n.includes("класич")) return "classic";
      if (n.includes("вершков")) return "cream";
      return "";
    }
    function money(value) {
      const nums = String(value || "").replace(/\s/g, "").match(/\d+/);
      return nums ? nums[0] + " грн" : "";
    }
    function weightOf(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return /^\d+$/.test(text) ? text + " г" : text;
    }
    function countOf(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return /шт/i.test(text) ? text : text + " шт";
    }
    function portionOf(row) {
      if (!row) return "";
      return [weightOf(row[2]), countOf(row[4])].filter(Boolean).join(" · ");
    }
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i += 1; } else quoted = false; } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }
    function apply(rows) {
      const map = {};
      rows.forEach((row) => {
        const key = kind(row[0] || "");
        if (key && !map[key]) map[key] = row;
      });
      document.querySelectorAll("[data-name]").forEach((el) => {
        const row = map[el.dataset.name];
        el.textContent = row ? String(row[0] || "").trim() : "";
      });
      document.querySelectorAll("[data-key]").forEach((el) => {
        const row = map[el.dataset.key];
        el.textContent = row ? money(row[3]) : "";
      });
      document.querySelectorAll("[data-weight]").forEach((el) => {
        const row = map[el.dataset.weight];
        el.textContent = row ? weightOf(row[2]) : "";
      });
      document.querySelectorAll("[data-portion]").forEach((el) => {
        el.textContent = portionOf(map[el.dataset.portion]);
      });
      document.querySelectorAll("[data-ings]").forEach((el) => {
        const row = map[el.dataset.ings];
        const next = row ? String(row[5] || "").trim() : "";
        el.textContent = next;
        el.hidden = !next;
      });
      const flavor = map.cream || map.classic;
      document.getElementById("kgBadge").textContent = flavor ? weightOf(flavor[2]) : "";
    }
    let shown = "";
    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => res.text())
        .then((text) => {
          const next = parseCsv(text).slice(1).filter((row) => row[0]);
          const key = JSON.stringify(next);
          if (key === shown) return;
          shown = key;
          apply(next);
        })
        .catch(() => {});
    }
    function fit() {
      const root = document.documentElement;
      root.style.setProperty("--sx", String(window.innerWidth / 1280));
      root.style.setProperty("--sy", String(window.innerHeight / 720));
    }
    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); return; }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });
    fit();
    pull();
    setInterval(pull, 120000);
    window.addEventListener("resize", fit);
    document.addEventListener("fullscreenchange", fit);
    const qrLib = document.createElement("script");
    qrLib.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    qrLib.onload = () => {
      const qr = qrcode(0, "M");
      const link = location.protocol.startsWith("http") ? new URL("/list.html", location.href).href : new URL("list.html", location.href).href;
      qr.addData(link);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    };
    document.body.appendChild(qrLib);

    const SIL_SVG = '<svg viewBox="0 0 200 110">' +
      '<g class="up">' +
        '<path fill="#7a4630" d="M104 54 C82 16 46 6 16 22 C36 28 34 40 54 42 C32 36 10 46 22 58 C44 52 74 54 104 62 Z"/>' +
        '<path fill="#7a4630" d="M122 48 C146 14 176 12 196 32 C174 38 152 50 128 58 Z"/>' +
      '</g>' +
      '<g class="down">' +
        '<path fill="#7a4630" d="M104 58 C80 66 42 84 14 102 C36 88 40 74 60 76 C38 92 22 104 42 102 C62 90 84 72 104 66 Z"/>' +
        '<path fill="#7a4630" d="M124 56 C148 76 174 98 196 106 C172 92 150 74 126 66 Z"/>' +
      '</g>' +
      '<ellipse cx="118" cy="60" rx="18" ry="11" fill="#141014"/>' +
      '<circle cx="140" cy="52" r="11" fill="#141014"/>' +
      '<path fill="#141014" d="M132 46 L136 28 L146 44 L150 26 L158 48 Z"/>' +
      '<circle cx="144" cy="50" r="2.1" fill="#ff2a18"/>' +
      '</svg>';
    function silNode() {
      const el = document.createElement("div");
      el.className = "bat sil";
      el.innerHTML = SIL_SVG;
      return el;
    }
    const CRACK_SVG = '<svg class="cracks" viewBox="-100 -100 200 200">' +
      '<g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">' +
        '<path d="M0 0 L-48 -22 L-78 -8"/><path d="M0 0 L40 -46 L70 -34"/>' +
        '<path d="M0 0 L14 58 L6 86"/><path d="M0 0 L-36 38 L-62 58"/>' +
        '<path d="M0 0 L64 18 L96 28"/><path d="M0 0 L-12 -60 L-22 -84"/>' +
        '<path d="M0 0 L28 16 L46 8"/><path d="M0 0 L-24 -8 L-18 -28"/>' +
      '</g></svg>' +
      '<svg class="burst" viewBox="-20 -20 40 40"><polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="#fff"/></svg>';
    function batNode(cls) {
      const el = document.createElement("div");
      el.className = "bat " + cls;
      el.innerHTML = '<img class="up" src="bat-fly-up.png" alt="" decoding="sync">' +
        '<img class="down" src="bat-fly-down.png" alt="" decoding="sync">' +
        '<img class="shock" src="bat-shock.png" alt="" decoding="sync">' +
        '<img class="wince" src="bat-wince.png" alt="" decoding="sync">' +
        '<img class="daze" src="bat-dizzy.png" alt="" decoding="sync">' +
        '<img class="wake" src="bat-wake.png" alt="" decoding="sync">';
      return el;
    }
    function placeBat(el, x, y, sx, sy, rot, dir) {
      el.style.transform = "translate3d(" + x + "vw," + y + "vh,0) translate(-50%,-50%) scale(" + (dir * sx) + "," + sy + ") rotate(" + rot + "deg)";
    }
    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function bonk() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = bonk.ctx || (bonk.ctx = new Ctx());
        if (ctx.state === "suspended") ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.18);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (err) {}
    }
    function shakeStage() {
      const stage = document.querySelector(".stage");
      stage.classList.remove("smack");
      void stage.offsetWidth;
      stage.classList.add("smack");
      setTimeout(() => stage.classList.remove("smack"), 600);
    }
    function makeFlock(layer, dir) {
      return Array.from({ length: 18 }, (_, i) => {
        const el = silNode();
        const depth = i % 4;
        el.style.zIndex = String(2 + depth);
        el.style.opacity = String(0.78 + depth * 0.07);
        layer.appendChild(el);
        const dive = i % 5 === 0;
        const y0 = dive ? 2 + (i % 4) * 5 : 8 + (i % 7) * 10;
        return {
          el: el,
          y0: y0,
          dive: dive ? 26 + (i % 3) * 6 : (i % 3) - 1,
          speed: (62 + depth * 16 + (i % 3) * 5) / 1000,
          start: dir > 0 ? -22 - (i % 5) * 7 : 118 + (i % 5) * 7,
          delay: i * 95 + (i % 3) * 30,
          size: 0.48 + depth * 0.28,
          amp: 4 + (i % 4) * 1.6,
          phase: i * 0.9,
          flap: null,
          on: null
        };
      });
    }
    function stepFlock(flock, t, dir) {
      let flying = false;
      flock.forEach((bat) => {
        const tt = Math.max(0, t - bat.delay);
        const x = bat.start + dir * bat.speed * tt;
        const travel = clamp01(tt / 1600);
        const y = bat.y0 + bat.dive * travel + Math.sin(tt / 260 + bat.phase) * bat.amp;
        const gone = dir > 0 ? x > 128 : x < -28;
        const born = tt > 0;
        if (!gone) flying = true;
        const show = born && !gone;
        if (bat.on !== show) {
          bat.on = show;
          bat.el.style.visibility = show ? "visible" : "hidden";
        }
        const bank = Math.cos(tt / 260 + bat.phase) * 10;
        placeBat(bat.el, x, y, bat.size, bat.size, bank, dir);
        const flap = Math.floor(tt / 70) % 2 === 0;
        if (bat.flap !== flap) {
          bat.flap = flap;
          bat.el.classList.toggle("flap", flap);
        }
      });
      return flying;
    }

    let boomRunning = false;
    let boomAgain = "";
    function playBoom(mode) {
      if (boomRunning) { boomAgain = mode; return; }
      boomRunning = true;
      const run = mode === "pass" ? runPass : runHit;
      run(() => {
        boomRunning = false;
        if (boomAgain) {
          const next = boomAgain;
          boomAgain = "";
          playBoom(next);
        }
      });
    }
    function runPass(done) {
      const layer = document.getElementById("bats");
      layer.replaceChildren();
      const dir = Math.random() < 0.5 ? 1 : -1;
      const flock = makeFlock(layer, dir);
      const started = performance.now();
      function finish() {
        layer.replaceChildren();
        done();
      }
      function frame(now) {
        const t = now - started;
        const flying = stepFlock(flock, t, dir);
        if (flying && t < 8000) requestAnimationFrame(frame);
        else finish();
      }
      requestAnimationFrame(frame);
    }
    function runHit(done) {
      const layer = document.getElementById("bats");
      layer.replaceChildren();
      const dir = Math.random() < 0.5 ? 1 : -1;
      const flock = makeFlock(layer, dir);
      const hero = batNode("hero face-fly");
      hero.style.zIndex = "8";
      layer.appendChild(hero);
      const from = { x: dir > 0 ? -20 : 116, y: 14 + Math.random() * 16 };
      const impact = { x: 46 + Math.random() * 10, y: 34 + Math.random() * 12 };
      const exit = { x: dir > 0 ? 122 : -22, y: impact.y - 6 };
      const stars = [0, 1, 2].map(() => {
        const star = document.createElement("i");
        star.className = "star";
        star.textContent = "★";
        star.style.left = impact.x + "vw";
        star.style.top = impact.y + "vh";
        layer.appendChild(star);
        return star;
      });
      let smashed = false;
      let lastFace = "";
      let lastFlap = null;
      const started = performance.now();
      function finish() {
        layer.replaceChildren();
        document.querySelector(".stage").classList.remove("smack");
        done();
      }
      function frame(now) {
        const t = now - started;
        stepFlock(flock, t, dir);
        let x, y, sx, sy, rot, flapEvery;
        if (t < 1000) {
          const p = clamp01(t / 1000);
          const e = p * 0.35 + p * p * 0.65;
          x = lerp(from.x, impact.x, e);
          y = lerp(from.y, impact.y, e);
          sx = sy = lerp(0.35, 1.85, e);
          rot = Math.sin(t / 60) * 6;
          flapEvery = 70;
        } else if (t < 1400) {
          const p = clamp01((t - 1000) / 400);
          const squash = Math.sin(p * Math.PI);
          x = impact.x - dir * squash * 1.2;
          y = impact.y + squash * 1.4;
          sx = 1.85 * (1 + 0.4 * squash);
          sy = 1.85 * (1 - 0.46 * squash);
          rot = -dir * 14 * squash;
          flapEvery = 220;
        } else if (t < 2300) {
          const p = clamp01((t - 1400) / 900);
          x = impact.x + Math.sin(t / 90) * (1 - p) * 0.7;
          y = impact.y + Math.sin(p * Math.PI) * 1.8;
          sx = sy = lerp(1.7, 1.45, p);
          rot = Math.sin(t / 120) * 16 * (1 - p);
          flapEvery = 240;
        } else if (t < 2750) {
          const p = clamp01((t - 2300) / 450);
          x = impact.x;
          y = impact.y;
          sx = sy = lerp(1.45, 1.2, p);
          rot = Math.sin(t / 70) * 10 * (1 - p);
          flapEvery = 90;
        } else {
          const p = clamp01((t - 2750) / 1400);
          const e = p * p;
          x = lerp(impact.x, exit.x, e);
          y = lerp(impact.y, exit.y, p);
          sx = sy = lerp(1.2, 0.4, p);
          rot = dir * 8 * p;
          flapEvery = 60;
        }
        const face = t < 700 ? "fly" : t < 1000 ? "shock" : t < 1400 ? "wince" : t < 2150 ? "dizzy" : t < 2320 ? "wince" : t < 2680 ? "wake" : "fly";
        if (lastFace !== face) {
          lastFace = face;
          hero.classList.remove("face-fly", "face-shock", "face-wince", "face-dizzy", "face-wake");
          hero.classList.add("face-" + face);
        }
        placeBat(hero, x, y, sx, sy, rot, dir);
        const flap = Math.floor(t / flapEvery) % 2 === 0;
        if (lastFlap !== flap) {
          lastFlap = flap;
          hero.classList.toggle("flap", flap);
        }
        if (t >= 1000 && !smashed) {
          smashed = true;
          shakeStage();
          bonk();
          const hit = document.createElement("div");
          hit.className = "hit";
          hit.style.left = impact.x + "vw";
          hit.style.top = impact.y + "vh";
          hit.innerHTML = '<div class="flash"></div><div class="ring"></div>' + CRACK_SVG;
          const wash = document.createElement("div");
          wash.className = "wash";
          layer.append(wash, hit);
        }
        stars.forEach((star, i) => {
          const show = t > 1080 && t < 2700;
          const fadeIn = clamp01((t - 1080) / 160);
          const fadeOut = t < 2350 ? 1 : clamp01((2700 - t) / 350);
          star.style.opacity = show ? String(fadeIn * fadeOut) : "0";
          const ang = t / 190 + i * 2.094;
          const rad = 78 + i * 14;
          star.style.transform = "translate(" + Math.cos(ang) * rad + "px," + Math.sin(ang) * rad * 0.62 + "px)";
        });
        if (t < 4500) requestAnimationFrame(frame);
        else finish();
      }
      requestAnimationFrame(frame);
    }

    const fxBase = (new URLSearchParams(location.search).get("bot") || "https://kleshnevartelegrambot-production.up.railway.app").replace(/\/$/, "");
    let fxAfter = 0;
    try { fxAfter = Number(sessionStorage.getItem("tv8-fx") || 0) || 0; } catch (err) {}
    let fxBusy = false;
    function pollFx() {
      if (fxBusy) return;
      fxBusy = true;
      fetch(fxBase + "/fx?after=" + fxAfter, { cache: "no-store" })
        .then((res) => res.ok ? res.json() : null)
        .then((data) => {
          if (!data) return;
          (data.events || []).forEach((ev) => {
            if (ev.kind === "boom") playBoom("hit");
            else if (ev.kind === "boom1") playBoom("pass");
          });
          const cursor = Number(data.cursor || 0);
          if (cursor > fxAfter) {
            fxAfter = cursor;
            try { sessionStorage.setItem("tv8-fx", String(fxAfter)); } catch (err) {}
          }
        })
        .catch(() => {})
        .then(() => { fxBusy = false; });
    }
    pollFx();
    setInterval(pollFx, 1500);
    const BAT_SRC = ["bat-fly-up.png", "bat-fly-down.png", "bat-shock.png", "bat-wince.png", "bat-dizzy.png", "bat-wake.png"];
    function warmBats() {
      Promise.all(BAT_SRC.map((src) => {
        const img = new Image();
        img.decoding = "async";
        img.src = src;
        return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
      })).then(() => {
        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = "position:fixed;left:-420px;top:0;width:240px;height:283px;overflow:hidden;pointer-events:none;";
        const node = batNode("hero face-fly");
        holder.appendChild(node);
        document.body.appendChild(holder);
        const faces = ["face-fly", "face-fly flap", "face-shock", "face-wince", "face-dizzy", "face-wake"];
        let i = 0;
        const tick = () => {
          node.className = "bat hero " + faces[i];
          i += 1;
          if (i < faces.length) requestAnimationFrame(tick);
          else requestAnimationFrame(() => holder.remove());
        };
        requestAnimationFrame(tick);
      });
    }
    warmBats();
    const preview = new URLSearchParams(location.search);
    if (preview.has("boom1")) playBoom("pass");
    else if (preview.has("boom")) playBoom("hit");
  </script>
</body>
</html>
