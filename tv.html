<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070707;
      --paper: #f4efe6;
      --ember: #ff6a1a;
      --ash: #9a9084;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Manrope, system-ui, sans-serif;
    }
    body { overflow: hidden; }
    button { cursor: pointer; }
    .screen {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: var(--ink);
    }
    .top { position: relative; z-index: 3; padding: clamp(0.6rem, 2vh, 1.4rem) clamp(0.8rem, 2.4vw, 2rem) 0; }
    .logo-btn { display: block; border: 0; padding: 0; background: transparent; }
    .logo {
      display: block;
      height: clamp(3.2rem, 12vh, 7.5rem);
      width: auto;
      max-width: min(46vw, 28rem);
      object-fit: contain;
      object-position: left center;
    }
    .menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(0.7rem, 2vh, 1.5rem);
      width: min(96vw, 96rem);
      margin: 0 auto;
      padding: 0.2rem clamp(0.8rem, 2vw, 2rem) calc(28vh + 0.4rem);
      overflow: auto;
    }
    .board-chips { display: flex; flex-wrap: wrap; gap: 0.2rem 1.35rem; align-items: baseline; }
    .board-chips .board-title, .board-cards .board-title { width: 100%; grid-column: 1 / -1; }
    .board-chips .dish { display: flex; gap: 0.55rem; align-items: baseline; padding: 0.12rem 0; }
    .board-chips .dish-name { font-size: clamp(1rem, 1.55vw, 1.45rem); }
    .board-chips .dish-meta { display: none; }
    .board-chips .dish-price { font-size: clamp(1rem, 1.45vw, 1.35rem); }
    .board-cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(0.45rem, 1.2vw, 1.1rem);
    }
    .board-cards .dish, .board-cards .dish-stack { display: block; padding: 0.1rem 0 0.35rem; }
    .board-cards .dish-name { font-size: clamp(1.05rem, 1.55vw, 1.5rem); }
    .board-cards .size-grid { grid-template-columns: 1fr; gap: 0.18rem; margin-top: 0.35rem; }
    .board-cards .size-grid > div {
      display: grid;
      grid-template-columns: 2.3rem minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 0.2rem 0.35rem;
    }
    .board-cards .size-grid i {
      color: var(--ash);
      font-style: normal;
      font-weight: 600;
      font-size: clamp(0.68rem, 0.9vw, 0.88rem);
      white-space: nowrap;
    }
    .board-cards .size-grid b { display: inline; color: var(--paper); font-size: clamp(0.85rem, 1.15vw, 1.1rem); }
    .board-cards .size-grid span { font-size: clamp(0.85rem, 1.2vw, 1.15rem); }
    .board-title {
      margin: 0 0 0.35rem;
      color: var(--ember);
      font-size: clamp(0.78rem, 1.35vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }
    .dish {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 1rem;
      align-items: center;
      padding: clamp(0.35rem, 0.9vh, 0.7rem) 0;
    }
    .dish-name {
      color: var(--paper);
      font-size: clamp(1.15rem, 2.15vw, 2.15rem);
      font-weight: 800;
      line-height: 1.05;
    }
    .dish-meta {
      margin-top: 0.18rem;
      color: var(--ash);
      font-size: clamp(0.78rem, 1.15vw, 1.05rem);
      font-weight: 600;
    }
    .dish-price {
      color: var(--ember);
      font-size: clamp(1.05rem, 1.7vw, 1.65rem);
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }
    .dish-stack { display: block; }
    .dish-head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .size-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.15rem 0.6rem;
      margin-top: 0.28rem;
    }
    .size-grid b {
      display: block;
      color: var(--ash);
      font-size: clamp(0.72rem, 1.05vw, 0.95rem);
      letter-spacing: 0.08em;
    }
    .size-grid span {
      color: var(--ember);
      font-size: clamp(0.92rem, 1.35vw, 1.3rem);
      font-weight: 800;
    }
    .menu-tight .dish-name { font-size: clamp(1rem, 1.7vw, 1.55rem); }
    .menu-tight .dish-price { font-size: clamp(0.92rem, 1.35vw, 1.3rem); }
    .demo-note { grid-column: 1 / -1; margin: 0.4rem 0 0; color: var(--ash); font-size: clamp(0.75rem, 1.2vw, 0.95rem); }
    .qr {
      position: absolute;
      z-index: 4;
      right: clamp(0.7rem, 2vw, 1.6rem);
      bottom: clamp(0.7rem, 2vh, 1.4rem);
      width: clamp(4.6rem, 12vh, 8.5rem);
      height: auto;
      border-radius: 0.7rem;
      background: var(--paper);
      box-shadow: 0 0 0 0.35rem var(--paper);
    }
    .flame {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: -2vh;
      width: 100%;
      height: 42vh;
      object-fit: cover;
      object-position: center 86%;
      pointer-events: none;
      mask-image: linear-gradient(to top, #000 58%, transparent 100%);
    }
    .embers {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sheet-panel {
      position: absolute;
      z-index: 5;
      top: clamp(4.5rem, 14vh, 8rem);
      left: clamp(0.8rem, 2.4vw, 2rem);
      width: min(28rem, calc(100vw - 1.6rem));
      display: none;
      gap: 0.7rem;
      padding: 1rem;
      border: 1px solid color-mix(in srgb, var(--paper) 16%, transparent);
      border-radius: 0.9rem;
      background: color-mix(in srgb, var(--ink) 92%, black);
    }
    .sheet-panel.open { display: grid; }
    .panel-title { margin: 0; font-weight: 800; }
    .panel-copy { margin: 0; color: var(--ash); font-size: 0.92rem; line-height: 1.45; }
    .sheet-panel input {
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--paper) 22%, transparent);
      border-radius: 0.6rem;
      padding: 0.75rem 0.8rem;
      background: transparent;
      color: var(--paper);
      font: inherit;
    }
    .panel-go {
      border: 0;
      border-radius: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: var(--ember);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
    }
    @media (max-width: 720px) {
      .logo { height: 2.6rem; max-width: 62vw; }
      .menu { padding: 0.4rem 0.8rem 8rem; }
      .board-cards { grid-template-columns: 1fr 1fr; }
      .board-chips .dish { width: 100%; justify-content: space-between; }
      .dish-price { font-size: 1rem; white-space: normal; }
      .qr { width: 4.1rem; }
      .flame { height: 28vh; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top">
      <button type="button" class="logo-btn" id="logoBtn" aria-label="Повний екран">
        <img src="logo-word.png" alt="Kleshnevar" class="logo" />
      </button>
    </header>
    <main class="menu" id="menu"></main>
    <p class="demo-note" id="note" hidden></p>
    <img class="qr" src="menu-qr.svg" alt="QR-код меню на сайті" />
    <video class="flame" id="flameA" src="fire.mp4" muted autoplay loop playsinline preload="auto"></video>
    <video class="flame" id="flameB" src="fire.mp4" muted autoplay loop playsinline preload="auto"></video>
    <canvas class="embers" id="embers" aria-hidden="true"></canvas>
  </div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=75204837&single=true&output=csv";
    const menuEl = document.getElementById("menu");
    const noteEl = document.getElementById("note");

    function shortName(name) {
      const cut = name.replace(/^креветки\s+/i, "").replace(/^раки\s+/i, "");
      return cut.charAt(0).toUpperCase() + cut.slice(1);
    }
    function metaLine(size, weight) {
      return [size, weight].filter((part) => part && part !== "-" && part !== "—").join(" · ");
    }
    function offersFor(row) {
      const chunks = (value) => String(value || "").split(/[,;/|]+/).map((part) => part.trim()).filter((part) => part && part !== "-" && part !== "—" && part !== "–");
      const counts = { m: "30–35 шт", l: "23–25 шт", xl: "15–18 шт", xxl: "10–14 шт" };
      const money = (value) => /грн/i.test(value) ? value : (/^\d+$/.test(value) ? value + " грн" : value);
      const pack = (sizes, weights, prices) => {
        const perSize = weights.length === sizes.length;
        const portion = perSize ? "" : (weights[0] || "");
        return sizes.map((size, index) => {
          const explicit = perSize ? weights[index] : "";
          const count = explicit && !/кг/i.test(explicit) ? (/шт/i.test(explicit) ? explicit : explicit + " шт") : (counts[size.toLowerCase()] || "");
          return { size, count, portion, price: prices[index] };
        });
      };
      const sizes = chunks(row[1]);
      if (sizes.length < 2) return [];
      const weights = chunks(row[2]);
      const written = chunks(row[3]);
      if (written.length === sizes.length) return pack(sizes, weights, written.map(money));
      const nums = String(row[3]).match(/\d+/g) || [];
      if (nums.length === sizes.length) return pack(sizes, weights, nums.map((num) => num + " грн"));
      const ladder = { m: "1300 грн", l: "1750 грн", xl: "2300 грн", xxl: "2800 грн" };
      const priced = sizes.map((size) => ladder[size.toLowerCase()]);
      if (priced.every(Boolean) && nums[0] === "1300" && nums[1] === "2800") return pack(sizes, weights, priced);
      return [];
    }
    function addDish(board, row, lines) {
      const dish = document.createElement("article");
      if (!lines.length) {
        dish.className = "dish";
        const copy = document.createElement("div");
        const name = document.createElement("div");
        name.className = "dish-name";
        name.textContent = shortName(row[0]);
        copy.appendChild(name);
        const meta = metaLine(row[1], row[2]);
        if (meta) {
          const sub = document.createElement("div");
          sub.className = "dish-meta";
          sub.textContent = meta;
          copy.appendChild(sub);
        }
        const price = document.createElement("div");
        price.className = "dish-price";
        price.textContent = row[3];
        dish.append(copy, price);
        board.appendChild(dish);
        return;
      }
      dish.className = "dish dish-stack";
      const head = document.createElement("div");
      head.className = "dish-head";
      const name = document.createElement("div");
      name.className = "dish-name";
      name.textContent = shortName(row[0]);
      head.appendChild(name);
      const portion = lines.every((line) => line.portion === lines[0].portion) ? lines[0].portion : "";
      if (portion) {
        const sub = document.createElement("div");
        sub.className = "dish-meta";
        sub.textContent = portion;
        head.appendChild(sub);
      }
      const grid = document.createElement("div");
      grid.className = "size-grid";
      lines.forEach((line) => {
        const cell = document.createElement("div");
        const label = document.createElement("b");
        label.textContent = line.size;
        const price = document.createElement("span");
        price.textContent = line.price;
        cell.append(label);
        if (line.count) {
          const count = document.createElement("i");
          count.textContent = line.count;
          cell.append(count);
        }
        cell.append(price);
        grid.appendChild(cell);
      });
      dish.append(head, grid);
      board.appendChild(dish);
    }
    function addBoard(title, items) {
      if (!items.length) return;
      const board = document.createElement("section");
      board.className = title === "Раки" ? "board board-cards" : "board board-chips";
      const heading = document.createElement("h2");
      heading.className = "board-title";
      heading.textContent = title;
      board.appendChild(heading);
      const groups = [];
      items.forEach((row) => {
        const last = groups[groups.length - 1];
        if (last && last[0][0] === row[0]) last.push(row);
        else groups.push([row]);
      });
      groups.forEach((group) => {
        const counts = { m: "30–35 шт", l: "23–25 шт", xl: "15–18 шт", xxl: "10–14 шт" };
          const lines = group.length > 1
          ? group.map((row) => {
              const explicit = row[2] && !/кг/i.test(row[2]) ? row[2] : "";
              const count = explicit ? (/шт/i.test(explicit) ? explicit : explicit + " шт") : (counts[String(row[1]).toLowerCase()] || "");
              return { size: row[1], count, portion: /кг/i.test(row[2]) ? row[2] : "", price: row[3] };
            })
          : offersFor(group[0]);
        addDish(board, group[0], lines);
      });
      menuEl.appendChild(board);
    }
    function paint(rows, problem) {
      const shrimp = [];
      const cray = [];
      const rest = [];
      rows.forEach((row) => {
        const name = row[0].toLowerCase();
        if (name.includes("кревет")) shrimp.push(row);
        else if (name.includes("рак")) cray.push(row);
        else rest.push(row);
      });
      menuEl.replaceChildren();
      addBoard("Креветки", shrimp);
      addBoard("Раки", cray);
      addBoard("Меню", rest);
      menuEl.classList.toggle("menu-tight", rows.length > 16);
      noteEl.hidden = !problem;
      noteEl.textContent = problem || "";
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 1; }
            else quoted = false;
          } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }

    let shown = "";
    let pending = "";
    let hits = 0;
    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => { if (!res.ok) throw new Error(String(res.status)); return res.text(); })
        .then((text) => {
          const next = parseCsv(text).slice(1).map((c) => [c[0] || "", c[1] || "", c[2] || "", c[3] || ""]).filter((r) => r.some(Boolean));
          const key = JSON.stringify(next);
          const problem = next.length ? "" : "У таблиці немає рядків.";
          if (!shown) {
            shown = key;
            paint(next, problem);
            return;
          }
          if (key === shown) {
            pending = "";
            hits = 0;
            return;
          }
          if (key === pending) hits += 1;
          else { pending = key; hits = 1; }
          if (hits >= 2) {
            shown = key;
            pending = "";
            hits = 0;
            paint(next, problem);
          }
        })
        .catch(() => { noteEl.hidden = false; noteEl.textContent = "Не вдалося прочитати таблицю."; });
    }

    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        return;
      }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });

    pull();
    setInterval(pull, 5000);
    document.addEventListener("visibilitychange", pull);
  </script>
  <script>
    (function () {
      const a = document.getElementById("flameA");
      const b = document.getElementById("flameB");
      const embers = document.getElementById("embers");
      const ectx = embers.getContext("2d");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const rand = (min, max) => min + Math.random() * (max - min);
      const fade = 0.85;
      function cover(time, duration) {
        if (time < fade) return time / fade;
        if (time > duration - fade) return (duration - time) / fade;
        return 1;
      }
      function makeEmber(w, h) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(6, 28);
        return {
          x: Math.random() * w, y: Math.random() * h,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - rand(0, 8),
          r: rand(0.35, 1.6),
          a: Math.random() < 0.16 ? rand(0.14, 0.28) : rand(0.035, 0.1),
          phase: rand(0, Math.PI * 2),
          streak: Math.random() < 0.4
        };
      }
      const sparks = [];
      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        embers.width = Math.max(1, embers.clientWidth * dpr);
        embers.height = Math.max(1, embers.clientHeight * dpr);
        const count = Math.round((embers.clientWidth * embers.clientHeight) / 18000);
        while (sparks.length < Math.min(140, Math.max(48, count))) sparks.push(makeEmber(embers.width, embers.height));
      }
      resize();
      new ResizeObserver(resize).observe(embers);
      if (reduced) { a.pause(); b.pause(); }
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const time = now / 1000;
        const duration = a.duration;
        if (!reduced && duration && isFinite(duration)) {
          const target = (a.currentTime + duration / 2) % duration;
          const gap = Math.abs(b.currentTime - target);
          if (gap > 0.18 && gap < duration - 0.18) b.currentTime = target;
          const oa = cover(a.currentTime, duration);
          const ob = cover(target, duration);
          const sum = oa + ob || 1;
          a.style.opacity = String(oa / sum);
          b.style.opacity = String(ob / sum);
        }
        const w = embers.width, h = embers.height;
        ectx.clearRect(0, 0, w, h);
        sparks.forEach((spark) => {
          if (!reduced) {
            spark.x += spark.vx * dt;
            spark.y += spark.vy * dt;
            spark.vx += Math.sin(time * 0.7 + spark.phase) * 4 * dt;
            spark.vy += Math.cos(time * 0.5 + spark.phase) * 4 * dt;
            const speed = Math.hypot(spark.vx, spark.vy) || 1;
            if (speed > 32) { spark.vx *= 32 / speed; spark.vy *= 32 / speed; }
            if (spark.x < -16) spark.x = w + 16;
            if (spark.x > w + 16) spark.x = -16;
            if (spark.y < -16) spark.y = h + 16;
            if (spark.y > h + 16) spark.y = -16;
          }
          const alpha = spark.a * (0.65 + 0.35 * Math.sin(time * 1.4 + spark.phase));
          const color = "rgba(255," + (150 + spark.r * 30) + ",60," + Math.max(0.02, alpha) + ")";
          if (spark.streak) {
            ectx.strokeStyle = color;
            ectx.lineWidth = Math.max(0.5, spark.r * 0.65);
            ectx.beginPath();
            ectx.moveTo(spark.x, spark.y);
            ectx.lineTo(spark.x - spark.vx * 0.12, spark.y - spark.vy * 0.12);
            ectx.stroke();
          } else {
            ectx.fillStyle = color;
            ectx.beginPath();
            ectx.arc(spark.x, spark.y, spark.r, 0, Math.PI * 2);
            ectx.fill();
          }
        });
        if (!reduced) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
