<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070707;
      --paper: #f4efe6;
      --ember: #ff6a1a;
      --ash: #9a9084;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Manrope, system-ui, sans-serif;
    }
    body { overflow: hidden; }
    button { cursor: pointer; }
    .screen {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: var(--ink);
    }
    .top { position: relative; z-index: 3; padding: clamp(0.6rem, 2vh, 1.4rem) clamp(0.8rem, 2.4vw, 2rem) 0; }
    .logo-btn { display: block; border: 0; padding: 0; background: transparent; }
    .logo {
      display: block;
      height: clamp(3.2rem, 12vh, 7.5rem);
      width: auto;
      max-width: min(46vw, 28rem);
      object-fit: contain;
      object-position: left center;
    }
    .menu {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(92vw, 86rem);
      margin: 0 auto;
      padding: 0.5rem 0 calc(26vh + 1rem);
      overflow: auto;
    }
    .headings, .line {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(7.5rem, 1.15fr) minmax(4.2rem, 0.45fr) minmax(7.5rem, 0.95fr);
      column-gap: clamp(0.4rem, 1.6vw, 1.6rem);
      align-items: baseline;
    }
    .headings {
      margin-bottom: 0.35rem;
      color: var(--ember);
      font-size: clamp(0.72rem, 1.5vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .line {
      padding: clamp(0.28rem, 0.7vh, 0.55rem) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--ember) 35%, transparent);
      color: var(--ember);
      font-size: clamp(1rem, 2.5vw, 2.35rem);
      font-weight: 700;
      line-height: 1.15;
    }
    .menu-tight .line {
      font-size: clamp(0.92rem, 2vw, 1.7rem);
      padding-block: clamp(0.16rem, 0.4vh, 0.35rem);
    }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .price { text-align: right; }
    .line span:nth-child(2),
    .line span:nth-child(3),
    .headings span:nth-child(2),
    .headings span:nth-child(3) { text-align: center; }
    .headings span:last-child, .price { text-align: right; }
    .demo-note { margin: 0.8rem 0 0; color: var(--ash); font-size: clamp(0.75rem, 1.2vw, 0.95rem); }
    .qr {
      position: absolute;
      z-index: 4;
      right: clamp(0.7rem, 2vw, 1.6rem);
      bottom: clamp(0.7rem, 2vh, 1.4rem);
      width: clamp(4.6rem, 12vh, 8.5rem);
      height: auto;
      border-radius: 0.7rem;
      background: var(--paper);
      box-shadow: 0 0 0 0.35rem var(--paper);
    }
    .flame {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: -2vh;
      width: 100%;
      height: 42vh;
      object-fit: cover;
      object-position: center 86%;
      pointer-events: none;
      mask-image: linear-gradient(to top, #000 58%, transparent 100%);
    }
    .embers {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sheet-panel {
      position: absolute;
      z-index: 5;
      top: clamp(4.5rem, 14vh, 8rem);
      left: clamp(0.8rem, 2.4vw, 2rem);
      width: min(28rem, calc(100vw - 1.6rem));
      display: none;
      gap: 0.7rem;
      padding: 1rem;
      border: 1px solid color-mix(in srgb, var(--paper) 16%, transparent);
      border-radius: 0.9rem;
      background: color-mix(in srgb, var(--ink) 92%, black);
    }
    .sheet-panel.open { display: grid; }
    .panel-title { margin: 0; font-weight: 800; }
    .panel-copy { margin: 0; color: var(--ash); font-size: 0.92rem; line-height: 1.45; }
    .sheet-panel input {
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--paper) 22%, transparent);
      border-radius: 0.6rem;
      padding: 0.75rem 0.8rem;
      background: transparent;
      color: var(--paper);
      font: inherit;
    }
    .panel-go {
      border: 0;
      border-radius: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: var(--ember);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
    }
    @media (max-width: 720px) {
      .logo { height: 2.6rem; max-width: 62vw; }
      .menu { justify-content: flex-start; width: min(94vw, 86rem); padding: 0.4rem 0 7.2rem; }
      .headings { font-size: 0.62rem; letter-spacing: 0.02em; }
      .headings span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .line { font-size: 0.92rem; }
      .name { white-space: normal; }
      .qr { width: 4.1rem; }
      .flame { height: 28vh; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top">
      <button type="button" class="logo-btn" id="logoBtn" aria-label="Повний екран">
        <img src="logo-word.png" alt="Kleshnevar" class="logo" />
      </button>
    </header>
    <main class="menu" id="menu">
      <div class="headings">
        <span>Найменування</span>
        <span>Розмір</span>
        <span>Вага</span>
        <span>Ціна</span>
      </div>
      <div class="rows" id="rows"></div>
      <p class="demo-note" id="note"></p>
    </main>
    <img class="qr" src="menu-qr.svg" alt="QR-код меню на сайті" />
    <video class="flame" id="flameA" src="fire.mp4" muted autoplay loop playsinline preload="auto"></video>
    <video class="flame" id="flameB" src="fire.mp4" muted autoplay loop playsinline preload="auto"></video>
    <canvas class="embers" id="embers" aria-hidden="true"></canvas>
  </div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=75204837&single=true&output=csv";
    const rowsEl = document.getElementById("rows");
    const menuEl = document.getElementById("menu");
    const noteEl = document.getElementById("note");

    function paint(rows, problem) {
      rowsEl.replaceChildren();
      rows.forEach((row) => {
        const line = document.createElement("div");
        line.className = "line";
        row.forEach((text, i) => {
          const span = document.createElement("span");
          if (i === 0) span.className = "name";
          if (i === 3) span.className = "price";
          span.textContent = text;
          line.appendChild(span);
        });
        rowsEl.appendChild(line);
      });
      menuEl.classList.toggle("menu-tight", rows.length > 9);
      noteEl.textContent = problem || "";
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 1; }
            else quoted = false;
          } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }

    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => { if (!res.ok) throw new Error(String(res.status)); return res.text(); })
        .then((text) => {
          const next = parseCsv(text).slice(1).map((c) => [c[0] || "", c[1] || "", c[2] || "", c[3] || ""]).filter((r) => r.some(Boolean));
          paint(next, next.length ? "" : "У таблиці немає рядків.");
        })
        .catch(() => { noteEl.textContent = "Не вдалося прочитати таблицю."; });
    }

    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        return;
      }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });

    pull();
    setInterval(pull, 4000);
    document.addEventListener("visibilitychange", pull);
  </script>
  <script>
    (function () {
      const a = document.getElementById("flameA");
      const b = document.getElementById("flameB");
      const embers = document.getElementById("embers");
      const ectx = embers.getContext("2d");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const rand = (min, max) => min + Math.random() * (max - min);
      const fade = 0.85;
      function cover(time, duration) {
        if (time < fade) return time / fade;
        if (time > duration - fade) return (duration - time) / fade;
        return 1;
      }
      function makeEmber(w, h) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(6, 28);
        return {
          x: Math.random() * w, y: Math.random() * h,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - rand(0, 8),
          r: rand(0.35, 1.6),
          a: Math.random() < 0.16 ? rand(0.14, 0.28) : rand(0.035, 0.1),
          phase: rand(0, Math.PI * 2),
          streak: Math.random() < 0.4
        };
      }
      const sparks = [];
      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        embers.width = Math.max(1, embers.clientWidth * dpr);
        embers.height = Math.max(1, embers.clientHeight * dpr);
        const count = Math.round((embers.clientWidth * embers.clientHeight) / 18000);
        while (sparks.length < Math.min(140, Math.max(48, count))) sparks.push(makeEmber(embers.width, embers.height));
      }
      resize();
      new ResizeObserver(resize).observe(embers);
      if (reduced) { a.pause(); b.pause(); }
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const time = now / 1000;
        const duration = a.duration;
        if (!reduced && duration && isFinite(duration)) {
          const target = (a.currentTime + duration / 2) % duration;
          const gap = Math.abs(b.currentTime - target);
          if (gap > 0.18 && gap < duration - 0.18) b.currentTime = target;
          const oa = cover(a.currentTime, duration);
          const ob = cover(target, duration);
          const sum = oa + ob || 1;
          a.style.opacity = String(oa / sum);
          b.style.opacity = String(ob / sum);
        }
        const w = embers.width, h = embers.height;
        ectx.clearRect(0, 0, w, h);
        sparks.forEach((spark) => {
          if (!reduced) {
            spark.x += spark.vx * dt;
            spark.y += spark.vy * dt;
            spark.vx += Math.sin(time * 0.7 + spark.phase) * 4 * dt;
            spark.vy += Math.cos(time * 0.5 + spark.phase) * 4 * dt;
            const speed = Math.hypot(spark.vx, spark.vy) || 1;
            if (speed > 32) { spark.vx *= 32 / speed; spark.vy *= 32 / speed; }
            if (spark.x < -16) spark.x = w + 16;
            if (spark.x > w + 16) spark.x = -16;
            if (spark.y < -16) spark.y = h + 16;
            if (spark.y > h + 16) spark.y = -16;
          }
          const alpha = spark.a * (0.65 + 0.35 * Math.sin(time * 1.4 + spark.phase));
          const color = "rgba(255," + (150 + spark.r * 30) + ",60," + Math.max(0.02, alpha) + ")";
          if (spark.streak) {
            ectx.strokeStyle = color;
            ectx.lineWidth = Math.max(0.5, spark.r * 0.65);
            ectx.beginPath();
            ectx.moveTo(spark.x, spark.y);
            ectx.lineTo(spark.x - spark.vx * 0.12, spark.y - spark.vy * 0.12);
            ectx.stroke();
          } else {
            ectx.fillStyle = color;
            ectx.beginPath();
            ectx.arc(spark.x, spark.y, spark.r, 0, Math.PI * 2);
            ectx.fill();
          }
        });
        if (!reduced) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
