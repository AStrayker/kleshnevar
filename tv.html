<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070707;
      --paper: #f4efe6;
      --ember: #ff6a1a;
      --ash: #9a9084;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: Manrope, system-ui, sans-serif;
    }
    body { overflow: hidden; }
    button { cursor: pointer; }
    .screen {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) 26vh;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: var(--ink);
    }
    .top { position: relative; z-index: 3; padding: clamp(0.6rem, 2vh, 1.4rem) clamp(0.8rem, 2.4vw, 2rem) 0; }
    .logo-btn { display: block; border: 0; padding: 0; background: transparent; }
    .logo {
      display: block;
      height: clamp(3.2rem, 12vh, 7.5rem);
      width: auto;
      max-width: min(46vw, 28rem);
      object-fit: contain;
      object-position: left center;
    }
    .menu {
      --fit: 28;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.45em;
      width: min(98vw, 120rem);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      padding: 0.25em 0.7em 0.15em;
      overflow: hidden;
      font-size: calc(var(--fit) * 1px);
    }
    .board-chips { display: flex; flex-wrap: wrap; gap: 0.2em 0.9em; align-items: baseline; }
    .board-chips .board-title, .board-cards .board-title { width: 100%; grid-column: 1 / -1; }
    .board-chips .dish { display: flex; gap: 0.4em; align-items: baseline; padding: 0.06em 0; }
    .board-chips .dish-name { font-size: 1.15em; color: #fff; }
    .board-chips .dish-meta { display: none; }
    .board-chips .dish-price { font-size: 1.15em; }
    .board-cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.35em 0.7em;
    }
    .board-cards .dish, .board-cards .dish-stack { display: block; padding: 0.05em 0 0.1em; }
    .board-cards .dish-name { font-size: 1.05em; color: #fff; }
    .board-cards .size-grid { grid-template-columns: 1fr; gap: 0.08em; margin-top: 0.16em; }
    .board-cards .size-grid > div {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.55em;
    }
    .board-cards .size-left {
      display: flex;
      align-items: baseline;
      gap: 0.4em;
      flex: none;
    }
    .board-cards .size-grid i {
      color: #ffe6cc;
      font-style: normal;
      font-weight: 700;
      font-size: 0.52em;
      white-space: nowrap;
    }
    .board-cards .size-grid b { color: #fff; font-size: 0.58em; white-space: nowrap; }
    .board-cards .size-grid span { margin-left: auto; font-size: 0.58em; white-space: nowrap; flex: none; }
    .board-title {
      margin: 0 0 0.2em;
      color: var(--ember);
      font-size: 0.55em;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .dish {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 0.6em;
      align-items: center;
      padding: 0.08em 0;
    }
    .dish-name { color: #fff; font-size: 1em; font-weight: 800; line-height: 1.05; }
    .dish-meta { margin-top: 0.1em; color: #ffe6cc; font-size: 0.7em; font-weight: 700; }
    .dish-price { color: #ff7a22; font-size: 1em; font-weight: 800; text-align: right; white-space: nowrap; }
    .dish-stack { display: block; }
    .dish-head { display: flex; justify-content: space-between; gap: 0.4em; align-items: baseline; }
    .size-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.15rem 0.6rem; margin-top: 0.28rem; }
    .qr {
      position: absolute;
      z-index: 4;
      right: clamp(0.7rem, 2vw, 1.6rem);
      bottom: clamp(0.7rem, 2vh, 1.4rem);
      width: clamp(4.6rem, 12vh, 8.5rem);
      height: auto;
      border-radius: 0.7rem;
      background: var(--paper);
      box-shadow: 0 0 0 0.35rem var(--paper);
    }
    .stage { position: relative; overflow: hidden; min-height: 0; }
    .flame {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center bottom;
      pointer-events: none;
    }
    @media (max-width: 720px) {
      .logo { height: 2.6rem; max-width: 62vw; }
      .menu { padding: 0.3em 0.5em 0.4em; }
      .board-cards { grid-template-columns: 1fr 1fr; }
      .board-chips .dish { width: 100%; justify-content: space-between; }
      .qr { width: 4.1rem; }
      .screen { grid-template-rows: auto minmax(0, 1fr) 18vh; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top">
      <button type="button" class="logo-btn" id="logoBtn" aria-label="Повний екран">
        <img src="logo-word.png" alt="Kleshnevar" class="logo" />
      </button>
    </header>
    <main class="menu" id="menu"></main>
    <p id="note" hidden></p>
    <img class="qr" src="menu-qr.svg" alt="QR-код меню на сайті" />
    <div class="stage">
      <video class="flame" id="flame" src="fire.mp4" muted autoplay loop playsinline preload="auto"></video>
    </div>
  </div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=75204837&single=true&output=csv";
    const menuEl = document.getElementById("menu");
    const noteEl = document.getElementById("note");

    function shortName(name) {
      const cut = name.replace(/^креветки\s+/i, "").replace(/^раки\s+/i, "");
      return cut.charAt(0).toUpperCase() + cut.slice(1);
    }
    function metaLine(size, weight) {
      return [size, weight].filter((part) => part && part !== "-" && part !== "—").join(" · ");
    }
    function offersFor(row) {
      const chunks = (value) => String(value || "").split(/[,;/|]+/).map((part) => part.trim()).filter((part) => part && part !== "-" && part !== "—" && part !== "–");
      const counts = { m: "30–35 шт", l: "23–25 шт", xl: "15–18 шт", xxl: "10–14 шт" };
      const money = (value) => /грн/i.test(value) ? value : (/^\d+$/.test(value) ? value + " грн" : value);
      const pack = (sizes, weights, prices) => {
        const perSize = weights.length === sizes.length;
        const portion = perSize ? "" : (weights[0] || "");
        return sizes.map((size, index) => {
          const explicit = perSize ? weights[index] : "";
          const count = explicit && !/кг/i.test(explicit) ? (/шт/i.test(explicit) ? explicit : explicit + " шт") : (counts[size.toLowerCase()] || "");
          return { size, count, portion, price: prices[index] };
        });
      };
      const sizes = chunks(row[1]);
      if (sizes.length < 2) return [];
      const weights = chunks(row[2]);
      const written = chunks(row[3]);
      if (written.length === sizes.length) return pack(sizes, weights, written.map(money));
      const nums = String(row[3]).match(/\d+/g) || [];
      if (nums.length === sizes.length) return pack(sizes, weights, nums.map((num) => num + " грн"));
      const ladder = { m: "1300 грн", l: "1750 грн", xl: "2300 грн", xxl: "2800 грн" };
      const priced = sizes.map((size) => ladder[size.toLowerCase()]);
      if (priced.every(Boolean) && nums[0] === "1300" && nums[1] === "2800") return pack(sizes, weights, priced);
      return [];
    }
    function addDish(board, row, lines) {
      const dish = document.createElement("article");
      if (!lines.length) {
        dish.className = "dish";
        const copy = document.createElement("div");
        const name = document.createElement("div");
        name.className = "dish-name";
        name.textContent = shortName(row[0]);
        copy.appendChild(name);
        const meta = metaLine(row[1], row[2]);
        if (meta) {
          const sub = document.createElement("div");
          sub.className = "dish-meta";
          sub.textContent = meta;
          copy.appendChild(sub);
        }
        const price = document.createElement("div");
        price.className = "dish-price";
        price.textContent = row[3];
        dish.append(copy, price);
        board.appendChild(dish);
        return;
      }
      dish.className = "dish dish-stack";
      const head = document.createElement("div");
      head.className = "dish-head";
      const name = document.createElement("div");
      name.className = "dish-name";
      name.textContent = shortName(row[0]);
      head.appendChild(name);
      const portion = lines.every((line) => line.portion === lines[0].portion) ? lines[0].portion : "";
      if (portion) {
        const sub = document.createElement("div");
        sub.className = "dish-meta";
        sub.textContent = portion;
        head.appendChild(sub);
      }
      const grid = document.createElement("div");
      grid.className = "size-grid";
      lines.forEach((line) => {
        const cell = document.createElement("div");
        const label = document.createElement("b");
        label.textContent = line.size;
        const price = document.createElement("span");
        price.textContent = line.price;
        const left = document.createElement("span");
        left.className = "size-left";
        left.append(label);
        if (line.count) {
          const count = document.createElement("i");
          count.textContent = line.count;
          left.append(count);
        }
        cell.append(left, price);
        grid.appendChild(cell);
      });
      dish.append(head, grid);
      board.appendChild(dish);
    }
    function addBoard(title, items) {
      if (!items.length) return;
      const board = document.createElement("section");
      board.className = title === "Раки" ? "board board-cards" : "board board-chips";
      const heading = document.createElement("h2");
      heading.className = "board-title";
      heading.textContent = title;
      board.appendChild(heading);
      const groups = [];
      items.forEach((row) => {
        const last = groups[groups.length - 1];
        if (last && last[0][0] === row[0]) last.push(row);
        else groups.push([row]);
      });
      groups.forEach((group) => {
        const counts = { m: "30–35 шт", l: "23–25 шт", xl: "15–18 шт", xxl: "10–14 шт" };
        const lines = group.length > 1
          ? group.map((row) => {
              const explicit = row[2] && !/кг/i.test(row[2]) ? row[2] : "";
              const count = explicit ? (/шт/i.test(explicit) ? explicit : explicit + " шт") : (counts[String(row[1]).toLowerCase()] || "");
              return { size: row[1], count, portion: /кг/i.test(row[2]) ? row[2] : "", price: row[3] };
            })
          : offersFor(group[0]);
        addDish(board, group[0], lines);
      });
      menuEl.appendChild(board);
    }
    function paint(rows, problem) {
      const shrimp = [];
      const cray = [];
      const rest = [];
      rows.forEach((row) => {
        const name = row[0].toLowerCase();
        if (name.includes("кревет")) shrimp.push(row);
        else if (name.includes("рак")) cray.push(row);
        else rest.push(row);
      });
      menuEl.replaceChildren();
      addBoard("Креветки", shrimp);
      addBoard("Раки", cray);
      addBoard("Меню", rest);
      noteEl.hidden = !problem;
      noteEl.textContent = problem || "";
    }
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 1; }
            else quoted = false;
          } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }
    let shown = "";
    let previous = "";
    let switchedAt = 0;
    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => { if (!res.ok) throw new Error(String(res.status)); return res.text(); })
        .then((text) => {
          const next = parseCsv(text).slice(1).map((c) => [c[0] || "", c[1] || "", c[2] || "", c[3] || ""]).filter((r) => r.some(Boolean));
          const key = JSON.stringify(next);
          if (key === shown) return;
          if (previous && key === previous && Date.now() - switchedAt < 12000) return;
          previous = shown;
          shown = key;
          switchedAt = Date.now();
          paint(next, next.length ? "" : "У таблиці немає рядків.");
          fitMenu();
        })
        .catch(() => { noteEl.hidden = false; noteEl.textContent = "Не вдалося прочитати таблицю."; });
    }
    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        return;
      }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });
    function crowded(menu) {
      if (menu.scrollHeight > menu.clientHeight + 2) return true;
      if (menu.scrollWidth > menu.clientWidth + 2) return true;
      const nodes = menu.querySelectorAll(".size-grid > div, .board-chips .dish, .dish-head");
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].scrollWidth > nodes[i].clientWidth + 1) return true;
      }
      return false;
    }
    function fitMenu() {
      const menu = menuEl;
      const max = Math.round(window.innerHeight * 0.08);
      let lo = 16;
      let hi = Math.max(lo + 2, max);
      let best = lo;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        menu.style.setProperty("--fit", String(mid));
        if (!crowded(menu)) { best = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      menu.style.setProperty("--fit", String(best));
    }
    pull();
    setInterval(pull, 2000);
    document.addEventListener("visibilitychange", pull);
    window.addEventListener("resize", fitMenu);
  </script>
  <script>
    (function () {
      const flame = document.getElementById("flame");
      const kick = () => flame.play().catch(function () {});
      flame.addEventListener("stalled", kick);
      flame.addEventListener("waiting", kick);
      flame.addEventListener("ended", function () { flame.currentTime = 0; kick(); });
      document.addEventListener("visibilitychange", function () { if (!document.hidden) kick(); });
      kick();
    })();
  </script>
</body>
</html>
