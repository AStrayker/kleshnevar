<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — вітрина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Marck+Script&family=Oswald:wght@500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet" />
  <style>
    :root { --red: #ff2a18; --ink: #070707; --line: rgba(255,255,255,.16); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--ink); color: #fff; font-family: Manrope, system-ui, sans-serif; }
    body { overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .screen {
      height: 100dvh; min-height: 100vh; display: grid;
      grid-template-rows: 15vh minmax(0, 1fr) 21vh 9vh;
      background: radial-gradient(1200px 420px at 50% 0%, rgba(255,40,20,.08), transparent 60%), var(--ink);
      overflow: hidden;
    }
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; padding: .4vh 2.2vw 0; }
    .slogan { display: flex; align-items: center; gap: .8rem; min-width: 0; }
    .slogan.left { justify-content: flex-start; transform: rotate(-6deg); transform-origin: left center; }
    .slogan.right { justify-content: flex-end; }
    .slogan p { margin: 0; font-family: "Marck Script", cursive; font-size: clamp(1.15rem, 2.5vh, 2.1rem); line-height: .95; }
    .slogan.right p { color: var(--red); font-size: clamp(1.2rem, 2.7vh, 2.25rem); }
    .under { height: .28rem; margin-top: .15rem; background: var(--red); border-radius: 2px; transform: rotate(-2deg); }
    .brand { text-align: center; }
    .word { border: 0; background: transparent; padding: 0; font-family: "Rubik Wet Paint", system-ui, sans-serif; font-size: clamp(3.2rem, 8.4vh, 7.2rem); line-height: .8; color: var(--red); text-shadow: 0 2px 0 #7a0c08; }
    .navline { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-top: .15rem; color: #f2f2f2; font-family: Oswald, sans-serif; font-size: clamp(.85rem, 1.7vh, 1.25rem); letter-spacing: .18em; }
    .navline i { display: block; height: 2px; width: clamp(2.5rem, 8vw, 7rem); background: var(--red); font-style: normal; }
    .claw { width: clamp(4.2rem, 11vh, 7.4rem); height: auto; flex: none; }
    .menu { --fit: 32; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; padding: .15em .6vw .2em; }
    .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 0 .55em; border-right: 2px solid rgba(255,255,255,.34); font-size: calc(var(--fit) * 1px); }
    .col:last-child { border-right: 0; }
    .mixes { font-size: clamp(24px, 3.35vh, 42px); padding-left: .15em; padding-right: .28em; }
    .mix-kg { color: #fff; font-family: Oswald, sans-serif; font-weight: 700; font-size: 1.35em; line-height: 1; letter-spacing: .04em; min-height: 1.35em; text-align: center; }
    .col-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
    .card { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 .15em .1em; overflow: hidden; }
    .card h2 { margin: 0 0 .08em; color: var(--red); font-family: Oswald, sans-serif; font-weight: 700; font-size: 1.7em; line-height: 1; white-space: nowrap; }
    .card.big h2 { font-size: 1.85em; }
    .ings { margin: .06em 0 .16em; color: #fff; font-weight: 700; font-size: .62em; line-height: 1.15; letter-spacing: .01em; white-space: normal; }
    .cost { display: flex; align-items: baseline; justify-content: flex-start; gap: .28em; white-space: nowrap; }
    .cost i, .cost em { font-style: normal; color: #fff; font-weight: 700; font-size: .64em; }
    .cost b { font-size: 1.7em; line-height: 1; }
    .card.big .cost b { font-size: 1.7em; }
    .rule { height: .12em; width: 100%; margin: .28em 0 0; background: var(--red); }
    .food { width: 100%; height: 100%; object-fit: cover; object-position: center 42%; display: block; }
    .foot { position: relative; display: flex; align-items: center; justify-content: flex-end; padding: 0 1.6vw; background: #050505; border-top: 3px solid #2a0604; overflow: visible; }
    .qrbox { position: absolute; left: 0; bottom: 0; z-index: 4; background: #fff; padding: .4rem; border-radius: 0 .45rem 0 0; line-height: 0; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
    .qrbox svg { width: clamp(13rem, 30vh, 22rem); height: auto; display: block; }
    .phone { color: #fff; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: .08em; font-size: clamp(1.7rem, 4.2vh, 3rem); }
  </style>
</head>
<body>
  <div class="screen">
    <header class="head">
      <div class="slogan left"><div><p>свіжі морепродукти<br>прямо до столу</p><div class="under"></div></div></div>
      <div class="brand">
        <button type="button" class="word" id="logoBtn">KLESHNEVAR</button>
        <div class="navline"><i></i>РАКИ · КРЕВЕТКИ · ПИВО<i></i></div>
      </div>
      <div class="slogan right">
        <svg class="claw" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ff2a18" stroke-width="3.5"/>
          <path d="M34 34c-10-8-18-1-14 8 3 6 10 6 13 1M36 30c2-8 12-8 12 0M66 34c10-8 18-1 14 8-3 6-10 6-13 1M64 30c-2-8-12-8-12 0" fill="none" stroke="#ff2a18" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="46" rx="9" ry="13" fill="#ff2a18"/>
          <path d="M41 58h18l-3 7H44zM43 65h14l-3 6h-8zM46 71h8l-4 9-4-9z" fill="#ff2a18"/>
        </svg>
        <div><p>смак<br>який<br>запам'ятовується</p><div class="under"></div></div>
      </div>
    </header>
    <main class="menu" id="menu"></main>
    <img class="food" src="board-food.jpg" alt="" />
    <footer class="foot"><div class="qrbox" id="qr"></div><a class="phone" href="tel:+380636503959">+380 63 650 39 59</a></footer>
  </div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=1124262152&single=true&output=csv";
    const menuEl = document.getElementById("menu");
    const ORDER = ["Креветки", "Мікс", "Мідії", "Раки"];
    function groupOf(name) {
      const n = name.toLowerCase();
      if (n.includes("міді") || n.includes("миди")) return "Мідії";
      if (n.includes("мікс") || n.includes("микс")) return "Мікс";
      if (n.includes("рак") || n.includes("bbq")) return "Раки";
      return "Креветки";
    }
    function money(value) {
      const nums = String(value || "").match(/\d+/g) || [];
      if (!nums.length) return String(value || "");
      return /грн/i.test(value) ? value : nums.join(" ") + " грн";
    }
    function weightOf(value) {
      const text = String(value || "").trim();
      if (/^\d+$/.test(text)) return text + " г";
      return text;
    }
    function ingredientsOf(name) {
      const n = name.toLowerCase();
      if (n.includes("vip")) return "клешні краба, щупальця кальмара, креветка 90/120, креветка 20/30, морський гребінець";
      if (n.includes("мікс") || n.includes("микс")) return "рак L, креветка 20/30, мідія чілі 100\\200, морський гребінець, кільця кальмара";
      return "";
    }
    function extraOf(name) {
      const n = name.toLowerCase();
      if (n.includes("міді") || n.includes("миди")) return "28-31 шт";
      if (n.includes("панко") && n.includes("кревет")) return "9 шт";
      return "";
    }
    function priceOf(row) {
      const n = row[0].toLowerCase();
      if (n.includes("міді") || n.includes("миди")) return "275 грн";
      return money(row[3]);
    }
    function placeRest(rows) {
      const groups = [[], [], []];
      const rank = (name) => {
        const n = name.toLowerCase();
        if (n.includes("соус")) return [2, 0];
        if (n.includes("міді") || n.includes("миди")) return [2, 1];
        if (n.includes("панко")) return [2, 2];
        if (n.includes("кха")) return [1, 0];
        if (n.includes("ям")) return [1, 1];
        if (n.includes("часник")) return [1, 2];
        if (n.includes("вершков")) return [0, 0];
        if (n.includes("класич")) return [0, 1];
        if (n.includes("томат")) return [0, 2];
        return null;
      };
      const extra = [];
      rows.forEach((row) => {
        const spot = rank(row[0]);
        if (!spot) { extra.push(row); return; }
        groups[spot[0]][spot[1]] = row;
      });
      extra.forEach((row) => {
        const group = groups.find((items) => items.filter(Boolean).length < 3) || groups[2];
        group.push(row);
      });
      return groups.map((items) => items.filter(Boolean));
    }
    function labelOf(name) {
      const n = name.toLowerCase();
      if (n.includes("vip")) return "Морський мікс VIP";
      if (n.includes("мікс") || n.includes("микс")) return "Морський мікс";
      if (n.includes("соус")) return "Соус вершковий";
      return name;
    }
    function paint(rows) {
      const mixes = rows.filter((row) => groupOf(row[0]) === "Мікс");
      const rest = rows.filter((row) => groupOf(row[0]) !== "Мікс");
      const groups = placeRest(rest);
      menuEl.replaceChildren();
      const make = (row, big) => {
        const card = document.createElement("article");
        card.className = "card" + (big ? " big" : "");
        const title = document.createElement("h2");
        title.textContent = labelOf(row[0]);
        const bits = [title];
        const ings = ingredientsOf(row[0]);
        if (ings) {
          const list = document.createElement("p");
          list.className = "ings";
          list.textContent = ings;
          bits.push(list);
        }
        const cost = document.createElement("div");
        cost.className = "cost";
        const weightText = weightOf(row[2]);
        if (weightText && !/^1\s*кг$/i.test(weightText)) {
          const weight = document.createElement("i");
          weight.textContent = weightText;
          cost.appendChild(weight);
        }
        const note = extraOf(row[0]);
        if (note) {
          const extra = document.createElement("em");
          extra.textContent = note;
          cost.appendChild(extra);
        }
        const price = document.createElement("b");
        price.textContent = priceOf(row);
        cost.appendChild(price);
        const rule = document.createElement("div");
        rule.className = "rule";
        card.append(...bits, cost, rule);
        return card;
      };
      const column = (items, big, kilo) => {
        const col = document.createElement("section");
        col.className = "col" + (big ? " mixes" : "");
        const head = document.createElement("div");
        head.className = "mix-kg";
        if (kilo) head.textContent = "1 кг";
        const body = document.createElement("div");
        body.className = "col-body";
        items.forEach((row) => body.appendChild(make(row, big)));
        col.append(head, body);
        return col;
      };
      menuEl.append(
        column(mixes, true, true),
        column(groups[0], false, true),
        column(groups[1], false, true),
        column(groups[2], false, false)
      );
    }
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i += 1; } else quoted = false; } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }
    let shown = "";
    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => res.text())
        .then((text) => {
          const next = parseCsv(text).slice(1).map((c) => [c[0] || "", c[1] || "", c[2] || "", c[3] || ""]).filter((r) => r[0]);
          const key = JSON.stringify(next);
          if (key === shown) return;
          shown = key;
          paint(next);
          requestAnimationFrame(fitMenu);
          setTimeout(fitMenu, 80);
        })
        .catch(() => {});
    }
    function crowded(menu) {
      return [...menu.querySelectorAll(".col:not(.mixes) h2, .col:not(.mixes) .cost")].some((node) => node.scrollWidth > node.clientWidth + 1);
    }
    function fitMenu() {
      const menu = menuEl;
      let lo = 16, hi = Math.round(window.innerHeight * 0.04), best = lo;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        menu.style.setProperty("--fit", String(mid));
        if (!crowded(menu)) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      menu.style.setProperty("--fit", String(best));
    }
    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); return; }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });
    pull();
    setInterval(pull, 2000);
    window.addEventListener("resize", fitMenu);
    document.fonts.ready.then(fitMenu);
    const qrLib = document.createElement("script");
    qrLib.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    qrLib.onload = () => {
      const qr = qrcode(0, "M");
      const link = location.protocol.startsWith("http") ? new URL("/list.html", location.href).href : new URL("list.html", location.href).href;
      qr.addData(link);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    };
    document.body.appendChild(qrLib);
  </script>
</body>
</html>
