<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Клешневар — раки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Marck+Script&family=Oswald:wght@500;600;700&family=Rubik+Wet+Paint&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #ff2a18; --ink: #070707; --line: rgba(255,255,255,.16);
      /* РОЗМІР QR-КОДА. Зміни тільки це число:
         22vh — менший, 24vh — як зараз, 28vh — більший.
         Не став більше, ніж висота фото + низ, інакше QR налізе на ціни. */
      --qr-size: 24vh;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--ink); color: #fff; font-family: Manrope, system-ui, sans-serif; }
    body { overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .screen {
      height: 100dvh; min-height: 100vh; display: grid;
      grid-template-rows: 17vh minmax(0, 1fr) 18vh 8vh;
      background: radial-gradient(1200px 420px at 50% 0%, rgba(255,40,20,.08), transparent 60%), var(--ink);
      overflow: hidden;
    }
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; padding: .4vh 2.2vw 0; }
    .slogan { display: flex; align-items: center; gap: .8rem; min-width: 0; }
    .slogan.left { justify-content: flex-start; transform: rotate(-6deg); transform-origin: left center; }
    .slogan.right { justify-content: flex-end; }
    .slogan p { margin: 0; font-family: "Marck Script", cursive; font-size: clamp(1.15rem, 2.5vh, 2.1rem); line-height: .95; }
    .slogan.right p { color: var(--red); font-size: clamp(1.2rem, 2.7vh, 2.25rem); }
    .under { height: .28rem; margin-top: .15rem; background: var(--red); border-radius: 2px; transform: rotate(-2deg); }
    .brand { text-align: center; }
    .word { border: 0; background: transparent; padding: 0; font-family: "Rubik Wet Paint", system-ui, sans-serif; font-size: clamp(3.2rem, 8.4vh, 7.2rem); line-height: .8; color: var(--red); text-shadow: 0 2px 0 #7a0c08; }
    .navline { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-top: .05rem; color: var(--red); font-family: Oswald, sans-serif; font-size: clamp(1.35rem, 3.1vh, 2.3rem); letter-spacing: .28em; font-weight: 700; }
    .navline i { display: block; height: 2px; width: clamp(2.5rem, 8vw, 7rem); background: var(--red); font-style: normal; }
    .kind { margin: .05rem 0 0; text-align: center; color: #fff; font-family: Oswald, sans-serif; font-weight: 700; letter-spacing: .34em; font-size: clamp(1.15rem, 2.6vh, 1.9rem); }
    .claw { width: clamp(4.2rem, 11vh, 7.4rem); height: auto; flex: none; }
    .menu { --fit: 28; min-height: 0; overflow: hidden; display: grid; padding: .05em .4vw .2em; font-size: calc(var(--fit) * 1px); }
    .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 0 .4em; border-right: 2px solid rgba(255,255,255,.34); overflow: hidden; }
    .col:last-child { border-right: 0; }
    .mix-kg { color: #fff; font-family: Oswald, sans-serif; font-weight: 700; font-size: 1.15em; line-height: 1; letter-spacing: .04em; min-height: 1.05em; text-align: center; }
    .sauce { margin: 0 0 .06em; color: var(--red); font-family: Oswald, sans-serif; font-weight: 700; font-size: 1.65em; line-height: 1; letter-spacing: .02em; text-align: center; white-space: nowrap; }
    .col-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
    .card { min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 .05em; }
    .card h2 { margin: 0; color: #fff; font-family: Oswald, sans-serif; font-weight: 700; font-size: 2em; line-height: 1; text-align: center; white-space: nowrap; }
    .cost { display: flex; align-items: baseline; justify-content: center; gap: .2em; white-space: nowrap; width: 100%; margin-top: .02em; }
    .cost em { font-style: normal; color: #fff; font-weight: 800; font-size: 1em; }
    .cost b { font-size: 2.15em; line-height: 1; font-weight: 800; color: var(--red); }
    .rule { height: .1em; width: 100%; margin: .08em 0 0; background: var(--red); }
    .food { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block; }
    .foot { position: relative; display: flex; align-items: center; justify-content: flex-end; padding: 0 1.6vw; background: #050505; border-top: 3px solid #2a0604; overflow: visible; }
    .qrbox { position: absolute; left: 0; bottom: 0; z-index: 4; background: #fff; padding: .4rem; border-radius: 0 .45rem 0 0; line-height: 0; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
    .qrbox svg { width: var(--qr-size); height: auto; display: block; }
    .phone { color: #fff; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: .08em; font-size: clamp(1.7rem, 4.2vh, 3rem); }
  </style>
</head>
<body>
  <div class="screen">
    <header class="head">
      <div class="slogan left"><div><p>свіжі морепродукти<br>прямо до столу</p><div class="under"></div></div></div>
      <div class="brand">
        <button type="button" class="word" id="logoBtn">KLESHNEVAR</button>
        <div class="navline"><i></i>РАКИ<i></i></div>
        <p class="kind">БУЛЬЙОНИ</p>
      </div>
      <div class="slogan right">
        <svg class="claw" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ff2a18" stroke-width="3.5"/>
          <path d="M34 34c-10-8-18-1-14 8 3 6 10 6 13 1M36 30c2-8 12-8 12 0M66 34c10-8 18-1 14 8-3 6-10 6-13 1M64 30c-2-8-12-8-12 0" fill="none" stroke="#ff2a18" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="46" rx="9" ry="13" fill="#ff2a18"/>
          <path d="M41 58h18l-3 7H44zM43 65h14l-3 6h-8zM46 71h8l-4 9-4-9z" fill="#ff2a18"/>
        </svg>
        <div><p>смак<br>який<br>запам'ятовується</p><div class="under"></div></div>
      </div>
    </header>
    <main class="menu" id="menu"></main>
    <img class="food" src="board-cray.jpg" alt="" />
    <footer class="foot"><div class="qrbox" id="qr"></div><a class="phone" href="tel:+380636503959">+380 63 650 39 59</a></footer>
  </div>
  <script>
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThtiqc3OtXf4aXEqRa4KkpPaCIbQ0WSnLplw2QdS0EcfMrXKkjZ0j2ro5qK-bCtsNH8ONIVIFUTc2o/pub?gid=75204837&single=true&output=csv";
    const menuEl = document.getElementById("menu");
    const SPEC = { m: "30-35 шт", l: "23-25 шт", xl: "15-18 шт", xxl: "10-14 шт" };
    function chunks(value) {
      return String(value || "").split(/[,;/|]+/).map((part) => part.trim()).filter((part) => part && part !== "-" && part !== "—");
    }
    function titleOf(name) {
      const n = name.toLowerCase();
      if (n.includes("bbq")) return "BBQ";
      if (n.includes("вершк")) return "Вершкові";
      if (n.includes("класик")) return "Класика";
      if (n.includes("томат")) return "Томатні";
      if (n.includes("пікант") || n.includes("пикант") || n.includes("hot")) return "Пікантні";
      return name.replace(/^раки\s+/i, "").toUpperCase();
    }
    function paint(rows) {
      const groups = [];
      const index = {};
      rows.filter((row) => row[0].toLowerCase().includes("рак")).forEach((row) => {
        if (index[row[0]] == null) { index[row[0]] = groups.length; groups.push([]); }
        groups[index[row[0]]].push(row);
      });
      menuEl.style.gridTemplateColumns = "repeat(" + Math.max(groups.length, 1) + ", minmax(0, 1fr))";
      menuEl.replaceChildren();
      groups.forEach((group) => {
        const full = group.find((row) => !/0[.,]\s*5/.test(row[2])) || group[0];
        const half = group.find((row) => /0[.,]\s*5/.test(row[2]));
        const sizes = chunks(full[1]);
        const fullNums = String(full[3]).match(/\d+/g) || [];
        const halfNums = half ? (String(half[3]).match(/\d+/g) || []) : [];
        const col = document.createElement("section");
        col.className = "col";
        const kilo = document.createElement("div");
        kilo.className = "mix-kg";
        kilo.textContent = "1 кг";
        const sauce = document.createElement("h2");
        sauce.className = "sauce";
        sauce.textContent = titleOf(full[0]);
        const body = document.createElement("div");
        body.className = "col-body";
        sizes.forEach((size, i) => {
          const card = document.createElement("article");
          card.className = "card";
          const title = document.createElement("h2");
          const spec = (SPEC[size.toLowerCase()] || "").replace(/\s*шт\s*$/i, "");
          title.textContent = spec ? size + " — " + spec : size;
          const cost = document.createElement("div");
          cost.className = "cost";
          const price = document.createElement("b");
          price.textContent = fullNums[i] ? fullNums[i] + " грн" : "";
          cost.append(price);
          if (half && halfNums[i]) {
            const extra = document.createElement("div");
            extra.className = "cost";
            const mark = document.createElement("em");
            mark.textContent = half[2] || "0.5 кг";
            const halfPrice = document.createElement("b");
            halfPrice.textContent = halfNums[i] + " грн";
            extra.append(mark, halfPrice);
            const rule = document.createElement("div");
            rule.className = "rule";
            card.append(title, cost, extra, rule);
          } else {
            const rule = document.createElement("div");
            rule.className = "rule";
            card.append(title, cost, rule);
          }
          body.appendChild(card);
        });
        col.append(kilo, sauce, body);
        menuEl.appendChild(col);
      });
    }
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i += 1; } else quoted = false; } else cell += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(cell.trim()); cell = ""; }
        else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }
    let shown = "";
    function pull() {
      fetch(CSV + "&_=" + Date.now(), { cache: "no-store" })
        .then((res) => res.text())
        .then((text) => {
          const next = parseCsv(text).slice(1).map((c) => [c[0] || "", c[1] || "", c[2] || "", c[3] || ""]).filter((r) => r[0]);
          const key = JSON.stringify(next);
          if (key === shown) return;
          shown = key;
          paint(next);
          requestAnimationFrame(fitMenu);
          setTimeout(fitMenu, 80);
        })
        .catch(() => {});
    }
    function crowded(menu) {
      const wide = [...menu.querySelectorAll(".sauce, .card h2, .cost b, .mix-kg")].some((node) => {
        const r = node.getBoundingClientRect();
        const box = node.closest(".col").getBoundingClientRect();
        return node.scrollWidth > node.clientWidth + 1 || r.right > box.right + 2 || r.left < box.left - 2;
      });
      const cards = [...menu.querySelectorAll(".card")];
      const hit = cards.some((card, i) => {
        const next = cards[i + 1];
        if (!next || card.parentElement !== next.parentElement) return false;
        return card.getBoundingClientRect().bottom > next.getBoundingClientRect().top + 1;
      });
      const clipped = [...menu.querySelectorAll(".col, .col-body")].some((node) => node.scrollHeight > node.clientHeight + 2);
      const last = menu.querySelector(".card:last-child");
      const cut = last && last.getBoundingClientRect().bottom > menu.getBoundingClientRect().bottom - 1;
      return wide || hit || clipped || cut || menu.scrollHeight > menu.clientHeight + 2;
    }
    function fitMenu() {
      const menu = menuEl;
      let lo = 16, hi = Math.round(window.innerHeight * 0.042), best = lo;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        menu.style.setProperty("--fit", String(mid));
        if (!crowded(menu)) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      menu.style.setProperty("--fit", String(best));
    }
    document.getElementById("logoBtn").addEventListener("click", () => {
      const root = document.documentElement;
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); return; }
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });
    pull();
    setInterval(pull, 2000);
    window.addEventListener("resize", fitMenu);
    document.fonts.ready.then(fitMenu);
    const qrLib = document.createElement("script");
    qrLib.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    qrLib.onload = () => {
      const qr = qrcode(0, "M");
      const link = location.protocol.startsWith("http") ? new URL("/list.html", location.href).href : new URL("list.html", location.href).href;
      qr.addData(link);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    };
    document.body.appendChild(qrLib);
  </script>
</body>
</html>
